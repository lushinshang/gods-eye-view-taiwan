<svg xmlns="http://www.w3.org/2000/svg" id="evidence-timeline-svg" viewBox="0 0 420 1230" class="timeline-svg" role="group" aria-labelledby="evidence-timeline-title evidence-timeline-description" font-family="PingFang TC, Noto Sans TC, sans-serif"><title id="evidence-timeline-title">證據如何沿用與校正</title><desc id="evidence-timeline-description">依相關事件的日期與採認關係整理，不按run數量計算覆蓋。來源執行與目前引用方式分開記錄；箭頭僅表示時間／判讀先後。 日期以Asia/Taipei表示；run ID不是執行日期證明。缺時戳時僅列輪次，不推造時間。</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.node-box{fill:#f5f8f6;stroke:#8da99f;stroke-width:1.4}.node.confirmed .node-box{fill:#fff3eb;stroke:#ae5a39}.node.unverified .node-box{fill:#f7f7f4;stroke:#8b938c;stroke-dasharray:5 4}.node-title{font-size:16px;font-weight:700;fill:#172d36}.node-line{font-size:13px;fill:#36545a}.node-state{font-size:11.5px;fill:#735219}.edge-base{fill:none;stroke:#527e75;stroke-width:1.7}.edge-base.architecture{stroke:#778b88}.edge-base.unverified_external{stroke:#7c847e;stroke-dasharray:6 5}.motion-line{fill:none;stroke:#11776a;stroke-width:3;stroke-dasharray:4 16;opacity:0}.boundary-line{stroke:#aab9b2;stroke-width:1;stroke-dasharray:3 5}.boundary-label{font-size:12px;fill:#536a62}.diagram-caption{font-size:12px;fill:#536a62}.node:focus .node-box,.node:hover .node-box{stroke:#9b6509;stroke-width:3}.node{outline:none}

.matrix-figure,.timeline-figure{margin:24px 0;padding:20px;border:1px solid #cbd8d1;border-radius:12px;background:#fcfdfb;min-width:0}.matrix-svg,.timeline-svg{display:block;width:100%;height:auto;max-width:500px;margin:20px auto}.matrix-caption{font-size:12px;fill:#52685e}.matrix-heading{font-size:13px;font-weight:700;fill:#274139}.matrix-id{font-size:13px;font-family:ui-monospace,monospace;fill:#243e36}.matrix-symbol{font-size:17px;fill:#426c62}.matrix-symbol.limited{fill:#84611b}.matrix-symbol.defect{fill:#a34227;font-weight:700}.matrix-symbol.historical_blocked,.matrix-symbol.subset_blocked{fill:#815321}.matrix-symbol.not_indexed{fill:#78867e}.matrix-row-bg{fill:#f3f6f3;stroke:#e0e6e1;stroke-width:.5}.matrix-row a:hover .matrix-row-bg,.matrix-row a:focus .matrix-row-bg{stroke:#a7751e;stroke-width:2}.matrix-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:12px;line-height:1.6}.matrix-legend strong{display:inline-block;min-width:22px}.table-scroll{max-width:100%;overflow-x:auto}.proof-table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}.proof-table th,.proof-table td{padding:9px;border:1px solid #d1dcd4;vertical-align:top}.proof-table th{text-align:left;background:#edf3ee}.proof-table caption{text-align:left;margin-bottom:10px}.cell-description{display:block;font-size:11px;color:#52685e}.timeline-date{font-size:12px;fill:#52685e}.timeline-title{font-size:16px;font-weight:700;fill:#172d36}.timeline-kind{font-size:11px;font-family:ui-monospace,monospace;fill:#70581d}.timeline-summary{font-size:13px;fill:#36544b}.timeline-node:hover rect,.timeline-node:focus rect{stroke:#a7751e;stroke-width:2}.timeline-transcript details{padding:8px 0;border-bottom:1px dotted #d5ded8}[data-filter-hidden="true"]{display:none!important}@media(max-width:720px){.matrix-figure,.timeline-figure{padding:10px}.matrix-legend{grid-template-columns:1fr}.matrix-figure figcaption p,.timeline-figure figcaption p{font-size:14px}}@media print{.