<svg xmlns="http://www.w3.org/2000/svg" id="improvement-order-svg" viewBox="0 0 420 570" role="group" aria-labelledby="improvement-order-title improvement-order-description" class="diagram-svg" font-family="PingFang TC, Noto Sans TC, sans-serif"><title id="improvement-order-title">改善工作的建議順序</title><desc id="improvement-order-description">這是報告建議的處理順序，不是已核准時程、CVSS排序或風險接受。各階段可並行準備；後續驗收須先具備對應輸入。</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.node-box{fill:#f5f8f6;stroke:#8da99f;stroke-width:1.4}.node.confirmed .node-box{fill:#fff3eb;stroke:#ae5a39}.node.unverified .node-box{fill:#f7f7f4;stroke:#8b938c;stroke-dasharray:5 4}.node-title{font-size:16px;font-weight:700;fill:#172d36}.node-line{font-size:13px;fill:#36545a}.node-state{font-size:11.5px;fill:#735219}.edge-base{fill:none;stroke:#527e75;stroke-width:1.7}.edge-base.architecture{stroke:#778b88}.edge-base.unverified_external{stroke:#7c847e;stroke-dasharray:6 5}.motion-line{fill:none;stroke:#11776a;stroke-width:3;stroke-dasharray:4 16;opacity:0}.boundary-line{stroke:#aab9b2;stroke-width:1;stroke-dasharray:3 5}.boundary-label{font-size:12px;fill:#536a62}.diagram-caption{font-size:12px;fill:#536a62}.node:focus .node-box,.node:hover .node-box{stroke:#9b6509;stroke-width:3}.node{outline:none}
</style><defs><marker id="improvement-order-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#527e75" /></marker></defs><rect width="420" height="570" fill="#fcfdfb" /><text x="16" y="24" class="diagram-caption" font-size="12" fill="#536a62">關係示意 · 非即時執行 · 節點可查看證據</text><path class="edge-base architecture" d="M210 166 V222" marker-end="url(#improvement-order-arrow)" fill="none" stroke="#778b88" stroke-width="1.7"><title>建議處理先後，可並行準備</title></path><path class="edge-base architecture" d="M210 348 V404" marker-end="url(#improvement-order-arrow)" fill="none" stroke="#778b88" stroke-width="1.7"><title>驗收須具備對應輸入</title></path><a class="node partial" href="#improvement-order-detail-decide" tabindex="0" aria-label="01　先釐清責任與修補決策：建議先處理，不代表已授權，查看證據與限制"><title>01　先釐清責任與修補決策；建議先處理，不代表已授權</title><rect class="node-box" x="24" y="48" width="372" height="118" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="36" y="75" class="node-title" font-size="16" fill="#172d36" font-weight="700">01　先釐清責任與修補決策</text><text x="36" y="98" class="node-line" font-size="13" fill="#36545a">F-001 修補決策／候選契約</text><text x="36" y="117" class="node-line" font-size="13" fill="#36545a">責任人與期限仍待指定</text><text x="36" y="155" class="node-state" font-size="11.5" fill="#735219">建議先處理，不代表已授權</text></a><a class="node partial" href="#improvement-order-detail-prepare" tabindex="0" aria-label="02　補齊所需輸入與新方案：原生 macOS／2 CPU 維持，查看證據與限制"><title>02　補齊所需輸入與新方案；原生 macOS／2 CPU 維持</title><rect class="node-box" x="24" y="230" width="372" height="118" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="36" y="257" class="node-title" font-size="16" fill="#172d36" font-weight="700">02　補齊所需輸入與新方案</text><text x="36" y="280" class="node-line" font-size="13" fill="#36545a">可核實工具／規則／資料庫</text><text x="36" y="299" class="node-line" font-size="13" fill="#36545a">受阻項有新證據才評估</text><text x="36" y="337" class="node-state" font-size="11.5" fill="#735219">原生 macOS／2 CPU 維持</text></a><a class="node partial" href="#improvement-order-detail-verify" tabindex="0" aria-label="03　依契約回歸與獨立複核：完成條件，不是目前已完成，查看證據與限制"><title>03　依契約回歸與獨立複核；完成條件，不是目前已完成</title><rect class="node-box" x="24" y="412" width="372" height="118" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="36" y="439" class="node-title" font-size="16" fill="#172d36" font-weight="700">03　依契約回歸與獨立複核</text><text x="36" y="462" class="node-line" font-size="13" fill="#36545a">正常對照／修補成品／必要變體</text><text x="36" y="481" class="node-line" font-size="13" fill="#36545a">未完成項仍需保留</text><text x="36" y="519" class="node-state" font-size="11.5" fill="#735219">完成條件，不是目前已完成</text></a></svg>