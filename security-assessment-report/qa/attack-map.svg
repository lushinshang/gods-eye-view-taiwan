f="#attack-map-detail-mcp-client" tabindex="0" aria-label="MCP 客戶端：來源模型＋部分契約，查看證據與限制"><title>MCP 客戶端；來源模型＋部分契約</title><rect class="node-box" x="220" y="52" width="184" height="102" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="232" y="79" class="node-title" font-size="16" fill="#172d36" font-weight="700">MCP 客戶端</text><text x="232" y="102" class="node-line" font-size="13" fill="#36545a">HTTP 與 stdio 分開</text><text x="232" y="121" class="node-line" font-size="13" fill="#36545a">非通用 PAT 認證</text><text x="232" y="143" class="node-state" font-size="11.5" fill="#735219">來源模型＋部分契約</text></a><a class="node partial" href="#attack-map-detail-api" tabindex="0" aria-label="AI 准入與輸入：指定 handler 子集，查看證據與限制"><title>AI 准入與輸入；指定 handler 子集</title><rect class="node-box" x="16" y="224" width="184" height="108" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="28" y="251" class="node-title" font-size="16" fill="#172d36" font-weight="700">AI 准入與輸入</text><text x="28" y="274" class="node-line" font-size="13" fill="#36545a">local gate／有效 PAT</text><text x="28" y="293" class="node-line" font-size="13" fill="#36545a">方法與 body 邊界</text><text x="28" y="321" class="node-state" font-size="11.5" fill="#735219">指定 handler 子集</text></a><a class="node partial" href="#attack-map-detail-mcp" tabindex="0" aria-label="MCP 傳輸與工具：helper／合成傳輸，查看證據與限制"><title>MCP 傳輸與工具；helper／合成傳輸</title><rect class="node-box" x="220" y="224" width="184" height="108" rx="10" fill="#f5f8f6" stroke="#8da99f" stroke-width="1.4" /><text x="232" y="251" class="node-title" font-size="16" fill="#172d36" font-weight="700">MCP 傳輸與工具</text><text x="232" y="274" class="node-line" font-size="13" fill="#36545a">HTTP gate／JSON-RPC</text><text x="232" y="293" class="node-line" font-size="13" fill="#36545a">stdio 為合成管線</text><text x="232" y="321" class="node-state" font-size="11.5" fill="#735219">helper／合成傳輸</text></a><a class="node confirmed" href="#attack-map-detail-advisor" tabindex="0" aria-l