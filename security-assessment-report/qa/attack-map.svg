<svg xmlns="http://www.w3.org/2000/svg" id="attack-map-svg" viewBox="0 0 420 1200" role="group" aria-labelledby="attack-map-title attack-map-description" class="diagram-svg" font-family="PingFang TC, Noto Sans TC, sans-serif"><title id="attack-map-title">攻擊面與信任邊界</title><desc id="attack-map-description">來源模型與指定測試的關係圖。箭頭表示資料或呼叫方向，不表示成功入侵。底部檔案、發布及呈現區是相鄰邊界，並非順序攻擊鏈。</desc><style>
