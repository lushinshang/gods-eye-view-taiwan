</style><rect width="420" height="1230" fill="#fcfdfb" /><path d="M28 52 V1130" fill="none" stroke="#a6bdb1" stroke-width="2" /><a class="timeline-node" href="#timeline-detail-TL-01" tabindex="0" aria-label="11/07｜2026，F-001 取得單元重現，HISTORICAL_EXECUTION，查看出處"><title>早期前置／BP有缺口；不回填為合規驗收。</title><circle cx="28" cy="52" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="20" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="44" class="timeline-date" font-size="12" fill="#52685e">11/07｜2026</text><text x="66" y="72" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">F-001 取得單元重現</text><text x="66" y="96" class="timeline-kind" font-size="11" fill="#70581d">HISTORICAL_EXECUTION</text><text x="66" y="124" class="timeline-summary" font-size="13" fill="#36544b">實際2艘，錯誤5艘仍被接受。</text></a><a class="timeline-node" href="#timeline-detail-TL-02" tabindex="0" aria-label="11/08｜2026，失敗與修正後結果並存，HISTORICAL_EXECUTION，查看出處"><title>保留失敗；後來PASS不覆寫原證據。</title><circle cx="28" cy="222" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="190" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="214" class="timeline-date" font-size="12" fill="#52685e">11/08｜2026</text><text x="66" y="242" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">失敗與修正後結果並存</text><text x="66" y="266" class="timeline-kind" font-size="11" fill="#70581d">HISTORICAL_EXECUTION</text><text x="66" y="294" class="timeline-summary" font-size="13" fill="#36544b">run-14失敗，run-15另建新attempt。</text></a><a class="timeline-node" href="#timeline-detail-TL-03" tabindex="0" aria-label="run-27 → 35｜輪次順序，契約測試逐步補齊，HISTORICAL_EXECUTION，查看出處"><title>run-27到35適用各輪替身與複核限制。</title><circle cx="28" cy="392" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="360" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="384" class="timeline-date" font-size="12" fill="#52685e">run-27 → 35｜輪次順序</text><text x="66" y="412" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">契約測試逐步補齊</text><text x="66" y="436" class="timeline-kind" font-size="11" fill="#70581d">HISTORICAL_EXECUTION</text><text x="66" y="464" class="timeline-summary" font-size="13" fill="#36544b">MCP／代理、取消／快取等指定子集。</text></a><a class="timeline-node" href="#timeline-detail-TL-04" tabindex="0" aria-label="11/09｜原始觀察 → 沿用，Standalone 保留受阻觀察，INHERITED_OBSERVATION，查看出處"><title>run-45沒有重建；0成品為NOT_ASSESSED。</title><circle cx="28" cy="562" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="530" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="554" class="timeline-date" font-size="12" fill="#52685e">11/09｜原始觀察 → 沿用</text><text x="66" y="582" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">Standalone 保留受阻觀察</text><text x="66" y="606" class="timeline-kind" font-size="11" fill="#70581d">INHERITED_OBSERVATION</text><text x="66" y="634" class="timeline-summary" font-size="13" fill="#36544b">原始run-43：CPU_RATE_EXCEEDED。</text></a><a class="timeline-node" href="#timeline-detail-TL-05" tabindex="0" aria-label="11/09｜原始成品 → 離線重評，Panel 成品審計離線重評，OFFLINE_REEVALUATION，查看出處"><title>SUPPORTED_BY_RETAINED_AUDIT，不是重掃。</title><circle cx="28" cy="732" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="700" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="724" class="timeline-date" font-size="12" fill="#52685e">11/09｜原始成品 → 離線重評</text><text x="66" y="752" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">Panel 成品審計離線重評</text><text x="66" y="776" class="timeline-kind" font-size="11" fill="#70581d">OFFLINE_REEVALUATION</text><text x="66" y="804" class="timeline-summary" font-size="13" fill="#36544b">run-43的722檔清冊，離線11項符合。</text></a><a class="timeline-node" href="#timeline-detail-TL-06" tabindex="0" aria-label="11/09｜07:47 臺灣時間，run-45 探針與診斷實際執行，EXECUTED，查看出處"><title>Chrome仍Target closed，不能稱DOM通過。</title><circle cx="28" cy="902" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="870" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="894" class="timeline-date" font-size="12" fill="#52685e">11/09｜07:47 臺灣時間</text><text x="66" y="922" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">run-45 探針與診斷實際執行</text><text x="66" y="946" class="timeline-kind" font-size="11" fill="#70581d">EXECUTED</text><text x="66" y="974" class="timeline-summary" font-size="13" fill="#36544b">Task1隔離對照；Task2治具正常收尾。</text></a><a class="timeline-node" href="#timeline-detail-TL-07" tabindex="0" aria-label="11/09｜文件日期，Review45 採認與文件勘誤，REVIEW_AND_ERRATUM，查看出處"><title>保留原15情境、2CPU與全案未放行。</title><circle cx="28" cy="1072" r="7" fill="#fcfdfb" stroke="#527e75" stroke-width="2" /><rect x="52" y="1040" width="352" height="148" rx="9" fill="#f2f6f3" stroke="#b3c8ba" /><text x="66" y="1064" class="timeline-date" font-size="12" fill="#52685e">11/09｜文件日期</text><text x="66" y="1092" class="timeline-title" font-size="16" fill="#172d36" font-weight="700">Review45 採認與文件勘誤</text><text x="66" y="1116" class="timeline-kind" font-size="11" fill="#70581d">REVIEW_AND_ERRATUM</text><text x="66" y="1144" class="timeline-summary" font-size="13" fill="#36544b">Guard／出處採認，撤回寫死舊觀測值。</text></a></svg>